<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kids Game</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  :root{color-scheme:dark;--night:#10142b;--panel:#1a2145;--line:#3b4788;--text:#fff8e7;--muted:#aab4e0;--candy:#ff5fa2}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--night);color:var(--text);
    font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;padding:24px 16px;box-sizing:border-box}
  main{width:min(460px,100%);text-align:center}
  h1{font-weight:400;font-size:34px;margin:0 0 20px}
  a.game{display:block;padding:22px 18px;border-radius:22px;background:var(--panel);border:3px solid var(--line);color:var(--text);text-decoration:none}
  a.game:hover,a.game:focus-visible{border-color:var(--candy);outline:none}
  a.game b{display:block;font-weight:400;font-size:24px;color:var(--candy)}
  a.game span{display:block;margin-top:6px;color:var(--muted);font-size:15px}
</style>
</head>
<body>
<main>
  <h1>🎮 게임 모음</h1>
  <a class="game" href="block-explorer-3d/">
    <b>알록달록 블록 탐험 3D</b>
    <span>고양이 탐험가가 되어 블록을 모으고 퍼즐판에서 팡!</span>
  </a>
</main>
</body>
</html>
